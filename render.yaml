# Настройки Render (Blueprint). Render читает этот файл при создании сайта через
# New → Blueprint и при каждом деплое. Документация: https://render.com/docs/blueprint-spec
services:
  - name: rastr
    type: web
    runtime: static
    branch: main
    autoDeployTrigger: commit
    # Сборка: ставим зависимости по package-lock.json и собираем сайт в dist/
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Адрес сайта для canonical, sitemap.xml и превью. Render спросит его при создании.
      # Пока своего домена нет, укажите адрес вида https://rastr.onrender.com
      - key: SITE_URL
        sync: false
    # Адреса без слеша в конце ведут на канонические, со слешем (301), чтобы у каждой страницы был один адрес.
    # Список проверяется тестом tests/seo.test.mjs — при добавлении страницы допишите её сюда.
    routes:
      - type: redirect
        source: /png-v-jpg
        destination: /png-v-jpg/
      - type: redirect
        source: /jpg-v-png
        destination: /jpg-v-png/
      - type: redirect
        source: /heic-v-jpg
        destination: /heic-v-jpg/
      - type: redirect
        source: /webp-v-jpg
        destination: /webp-v-jpg/
      - type: redirect
        source: /webp-v-png
        destination: /webp-v-png/
      - type: redirect
        source: /jpg-v-webp
        destination: /jpg-v-webp/
      - type: redirect
        source: /png-v-webp
        destination: /png-v-webp/
      - type: redirect
        source: /avif-v-jpg
        destination: /avif-v-jpg/
      - type: redirect
        source: /jpg-v-pdf
        destination: /jpg-v-pdf/
      - type: redirect
        source: /png-v-ico
        destination: /png-v-ico/
      - type: redirect
        source: /svg-v-png
        destination: /svg-v-png/
      - type: redirect
        source: /tiff-v-jpg
        destination: /tiff-v-jpg/
      - type: redirect
        source: /szhat-foto
        destination: /szhat-foto/
      - type: redirect
        source: /szhat-foto-do-kb
        destination: /szhat-foto-do-kb/
      - type: redirect
        source: /izmenit-razmer-foto
        destination: /izmenit-razmer-foto/
      - type: redirect
        source: /instrumenty
        destination: /instrumenty/
      - type: redirect
        source: /formaty
        destination: /formaty/
      - type: redirect
        source: /instrukciya
        destination: /instrukciya/
      - type: redirect
        source: /konfidencialnost
        destination: /konfidencialnost/
      - type: redirect
        source: /usloviya
        destination: /usloviya/
      - type: redirect
        source: /licenzii
        destination: /licenzii/
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # всегда только HTTPS
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      # сайту не нужны камера, микрофон, геолокация и прочие устройства — запрещаем
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      # Основная политика безопасности (CSP) встроена в каждую страницу метатегом, см. src/layout.mjs.
      # Здесь — только то, что метатегом задать нельзя: кто может показывать сайт во фрейме.
      # Разрешены сам сайт и Яндекс Метрика (просмотр записей Вебвизора и карты кликов).
      # X-Frame-Options не используется: он не умеет разрешать отдельные сайты.
      - path: /*
        name: Content-Security-Policy
        value: frame-ancestors 'self' https://*.yandex.ru https://*.yandex.by https://*.yandex.kz https://*.yandex.uz https://*.yandex.com https://*.yandex.com.tr
      # Стили и скрипты подключены с ?v=хеш, поэтому их можно долго кешировать;
      # остальные файлы в /assets/ (картинки-превью, иконки) кешируются на неделю
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
      # Render не знает расширение .webmanifest и отдаёт его как binary/octet-stream
      - path: /site.webmanifest
        name: Content-Type
        value: application/manifest+json
